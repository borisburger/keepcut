[workspace]
resolver = "3"
members = ["crates/keepcut-core", "crates/keepcut-cli", "crates/keepcut-player", "crates/keepcut"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.29", features = ["v4", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
tempfile = "3.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keepcut-core = { path = "crates/keepcut-core" }
