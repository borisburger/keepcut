name: Release

# Push a tag like v0.1.0 (matching the version in Cargo.toml) to build all packages and
# attach them to a draft GitHub release; review it and publish it by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Inno Setup 7
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe -OutFile $exe
          Start-Process -Wait $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER'
      - name: Package
        shell: pwsh
        run: ./packaging/windows/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: version
        run: echo "version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/linux/io.github.borisburger.Keepcut.yml
          bundle: Keepcut-${{ steps.version.outputs.version }}-linux-x86_64.flatpak
          cache-key: flatpak-builder-${{ hashFiles('packaging/linux/io.github.borisburger.Keepcut.yml') }}
          upload-artifact: false
      # Smart cuts of AV1 clips need a software AV1 encoder: SVT-AV1, linked into libavcodec.
      - name: Check SVT-AV1
        run: |
          ls flatpak_app/files/lib/libSvtAv1Enc.so*
          grep -q libSvtAv1Enc flatpak_app/files/lib/libavcodec.so.*
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: Keepcut-*.flatpak
          if-no-files-found: error

  appimage:
    # Built on AlmaLinux 9 (glibc 2.34), the oldest supported distribution, so the one
    # AppImage runs there and on everything newer.
    runs-on: ubuntu-24.04
    container:
      image: almalinux:9
    env:
      RUSTUP_HOME: /usr/local/rustup
      KEEPCUT_APPIMAGE_WORK: /work
    steps:
      - uses: actions/checkout@v7
      - name: Build environment
        run: |
          bash packaging/linux/appimage/deps-el9.sh
          echo /usr/local/cargo/bin >> "$GITHUB_PATH"
      - name: Build AppImage
        run: bash packaging/linux/appimage/build-appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  macos:
    # Best effort: a failed macOS build does not block the release.
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install mpv ffmpeg dylibbundler
      - run: packaging/macos/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [windows, flatpak, appimage, macos]
    if: always() && needs.windows.result == 'success' && needs.flatpak.result == 'success' && needs.appimage.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la artifacts
          gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" \
            --draft --title "Keepcut ${TAG#v}" --generate-notes
