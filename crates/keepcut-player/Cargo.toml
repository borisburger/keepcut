[package]
name = "keepcut-player"
description = "libmpv playback inside eframe/egui (glow), plus the Phase 0B player spike binary"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "wayland", "x11"] }
egui_glow = "0.37"
egui = "0.37"
glow = "0.17"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
serde_json.workspace = true
png = "0.18"
libmpv2 = "7.0.1"
libmpv2-sys = "4.0.1"
rfd = "0.18"
keepcut-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
